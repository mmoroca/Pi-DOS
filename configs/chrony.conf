# Retry DNS and NTP in the background, including after a cable is connected.
pool pool.ntp.org iburst maxsources 4
# Allow a large initial correction even when booting without a valid RTC.
makestep 1.0 3
rtcsync
driftfile /run/chrony/drift
pidfile /run/chrony/chronyd.pid
bindcmdaddress /run/chrony/chronyd.sock
# Client only; no UDP NTP server or monitoring listener.
port 0
cmdport 0
