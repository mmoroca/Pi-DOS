[sdl]
# Legacy/CRT baseline. Managed [pidos] monitor profiles override video at startup.
fullscreen=true
# Follow the DOS video mode: the initial 80x25 VGA prompt is 720x400.
# BOOT cmdline.txt requests the matching 70 Hz HDMI mode.
fullresolution=original
output=surface
videodriver=kmsdrm
waitonerror=false
[dosbox]
machine=svga_s3
memsize=16
synchronize time=true
[cpu]
cputype=pentium
core=dynamic_rec
cycles=fixed 71240
[render]
# Keep the VGA raster unchanged and request its resolution from SDL2/KMS.
char9=true
aspect=false
scaler=none
modeswitch=true
[voodoo]
voodoo_card=software
voodoo_maxmem=true
glide=false
[mixer]
rate=48000
blocksize=1024
prebuffer=30
[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
oplmode=auto
cms=off
[gus]
gus=false
gustype=classic
gusbase=240
gusirq=5
gusdma=3
gusmemsize=1024
ultradir=C:\ULTRASND
[speaker]
pcspeaker=true
tandy=off
[midi]
mpu401=none
mpubase=330
mpuirq=-1
mididevice=none
midiconfig=
samplerate=48000
[dos]
# Spanish keyboard (DOSBox-X layout code: sp).
keyboardlayout=sp
# Allow long filenames for DOS applications that support them.
lfn=true
[config]
# DOS country controls date/time and number formats.
# Default: 34 (Spain). Example: 1 (United States).
country=34

[joystick]
# Stable DOS gameport: two conventional joysticks, including late connections.
joysticktype=2axis
timed=true
autofire=false
