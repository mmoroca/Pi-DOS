[sdl]
fullscreen=true
# Follow the DOS video mode: the initial 80x25 VGA prompt is 720x400.
# BOOT cmdline.txt requests the matching 70 Hz HDMI mode.
fullresolution=original
output=surface
videodriver=kmsdrm
# Enable only when diagnosing CRT mode selection; requires emulator restart.
videodiagnostics=false
waitonerror=false
[dosbox]
machine=svga_s3
memsize=16
[cpu]
core=dynamic_rec
cycles=auto
[render]
# Keep the VGA raster unchanged and request its resolution from SDL2/KMS.
char9=true
aspect=false
scaler=none
modeswitch=true
[mixer]
rate=48000
blocksize=1024
prebuffer=30
[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
oplmode=opl2
[speaker]
pcspeaker=true
[midi]
mpu401=none
[dos]
keyboardlayout=us
# Allow long filenames for DOS applications that support them.
lfn=true
